<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Mój parkiet (demo)</title>

<style>

</style></head><body><main>
<div class="top"><div><div class="sub">Wartość portfela</div><div class="total" id="tot">—</div></div>

<div id="wsugg"></div>

<p class="sub" style="margin-top:30px;font-size:13px">Dane z Yahoo Finance mogą mieć kilkunastominutowe opóźnienie. Raporty AI to przegląd informacyjny, nie rekomendacja inwestycyjna.</p>
</main>
<script>
/* ===== TRYB DEMO: dane przykładowe, brak serwera =====
   Oryginalna aplikacja pobiera notowania, wiadomości i raporty AI z lokalnego serwera.
   W tej publicznej wersji zastępuje go ten krótki skrypt generujący dane przykładowe
   (fikcyjne spółki, wygenerowane notowania). Nic tu nie pochodzi z prawdziwego portfela. */
(function(){
 var NOW=Math.floor(Date.now()/1000),DAY=86400;
 var CO=[{s:'PEN.WA',n:'Przykładowa Energia SA',b:62},{s:'DBK.WA',n:'Demo Bank SA',b:118},{s:'TGR.WA',n:'Testowe Gry SA',b:184},{s:'WZH.WA',n:'Wzorcowy Handel SA',b:47},{s:'MTC.WA',n:'Mock Tech SA',b:29}];
 function hash(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
 function rnd(seed){var a=seed;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
 function base(s){var c=CO.find(function(x){return x.s==s});return c?c.b:50}
 /* cena dzienna: deterministyczny spacer losowy liczony wstecz od "dziś" */
 var CACHE={};
 function series(s){if(CACHE[s])return CACHE[s];var x=base(s),seed=rnd(hash(s)),k=3000,v=x,arr=[];
  for(var i=k;i>=0;i--){v=v*(1+(seed()-0.485)*0.022);v=Math.max(v,x*0.35);arr[i]=v}
  var scale=x/arr[0];for(var j=0;j<=k;j++)arr[j]*=scale;return CACHE[s]=arr}
 function dailyPrice(s,daysAgo){var a=series(s);return a[Math.min(daysAgo,a.length-1)]}
 function pts(s,fromSec,toSec,step){var out=[];for(var t=fromSec;t<=toSec;t+=step){var da=Math.max(0,Math.round((NOW-t)/DAY));var jitter=(rnd(hash(s+t))()-0.5)*0.004;out.push([t,+(dailyPrice(s,da)*(1+jitter)).toFixed(2)])}return out}
 function chart(s,r){var from,step=DAY;
  if(r=='1d'){from=NOW-8*3600;step=900;var d0=dailyPrice(s,1);var o=[];var v=d0;var g=rnd(hash(s+'1d'+Math.floor(NOW/DAY)));for(var t=from;t<=NOW;t+=step){v=v*(1+(g()-0.5)*0.004);o.push([t,+v.toFixed(2)])}
   return{price:o[o.length-1][1],prev:+d0.toFixed(2),stale:false,pts:o}}
  var prev=+dailyPrice(s,1).toFixed(2),to=NOW;
  if(r=='5d')from=NOW-5*DAY;else if(r=='1m')from=NOW-30*DAY;else if(r=='6m')from=NOW-182*DAY;else if(r=='1y')from=NOW-365*DAY;else if(r=='5y'){from=NOW-5*365*DAY;step=3*DAY}else if(r=='max'){from=NOW-8*365*DAY;step=5*DAY}
  else if(/^yr\d{4}$/.test(r)){var y=+r.slice(2);from=Math.floor(Date.UTC(y,0,1)/1000);to=Math.min(NOW,Math.floor(Date.UTC(y,11,31)/1000))}
  else from=NOW-30*DAY;
  var p=pts(s,from,to,step);return{price:+dailyPrice(s,0).toFixed(2),prev:prev,stale:false,pts:p}}
 function divs(s){var rr=rnd(hash(s+'div'));var amt=+(base(s)*0.025).toFixed(2);var out=[];
  for(var i=1;i<=4;i++)out.push({date:NOW-i*182*DAY+Math.floor(rr()*20)*DAY,amount:+(amt*(0.9+rr()*0.3)).toFixed(2)});return out}
 function news(q){var items=[];var hot=hash(q)%3==0;
  var titles=['Przykładowy nagłówek: nowe wyniki kwartalne (dane demo)','Przykładowy nagłówek: zmiana w zarządzie (dane demo)','Przykładowy nagłówek: komentarz analityków (dane demo)','Przykładowy nagłówek: plany inwestycyjne spółki (dane demo)'];
  titles.forEach(function(t,i){var d=new Date((NOW-(i*7+3)*3600)*1000).toISOString().replace('T',' ').slice(0,16);items.push({title:t+' – '+q,link:'#',date:d,hot:hot&&i==0})});return items}
 var REPORT='Wersja demonstracyjna: tutaj w pełnej aplikacji pojawia się raport napisany przez AI na podstawie świeżych nagłówków, zmian kursu i historii dywidend.\n\nPrzykładowy akapit o sytuacji spółki i jej branży. W prawdziwej wersji opisuje, co dzieje się wokół spółki, bez podawania bieżącej ceny.\n\nPrzykładowy akapit o ryzykach na najbliższe tygodnie i czynnikach, które mogą wspierać wzrost.\n\nTo przegląd informacyjny, nie rekomendacja inwestycyjna.';
 var of=window.fetch.bind(window);
 window.fetch=function(u,o){
  if(typeof u=='string'&&u.indexOf('/api/')==0){
   var url=new URL(u,'http://x'),p=url.pathname,q=url.searchParams,out;
   if(p=='/api/search'){var t=(q.get('q')||'').toLowerCase();out=CO.filter(function(c){return c.n.toLowerCase().indexOf(t)>-1||c.s.toLowerCase().indexOf(t)>-1}).map(function(c){return{s:c.s,n:c.n}})}
   else if(p=='/api/chart')out=chart(q.get('s'),q.get('r')||'1d');
   else if(p=='/api/div'){var d=divs(q.get('s'));out={next:hash(q.get('s'))%2?{date:NOW+20*DAY,amount:+(base(q.get('s'))*0.027).toFixed(2)}:null,recent:d.filter(function(x){return NOW-x.date<31*DAY})}}
   else if(p=='/api/divhist')out=divs(q.get('s'));
   else if(p=='/api/news')out=news(q.get('q')||'');
   else if(p=='/api/ai')out={text:REPORT};
   else out={error:'demo'};
   return new Promise(function(res){setTimeout(function(){res({json:function(){return Promise.resolve(out)}})},120)})}
  return of(u,o)};
 /* przykładowy portfel przy pierwszym wejściu */
 if(!localStorage.gpw){var L=function(daysAgo,qty,s){return{date:NOW-daysAgo*DAY,price:+dailyPrice(s,daysAgo).toFixed(2),qty:qty}};
  localStorage.gpw=JSON.stringify({p:[
   {s:'PEN.WA',n:'Przykładowa Energia SA',lots:[L(400,40,'PEN.WA'),L(120,25,'PEN.WA')],reports:[]},
   {s:'DBK.WA',n:'Demo Bank SA',lots:[L(300,15,'DBK.WA')],reports:[]},
   {s:'TGR.WA',n:'Testowe Gry SA',lots:[L(200,8,'TGR.WA')],reports:[]}],
   w:[{s:'MTC.WA',n:'Mock Tech SA',lots:[],reports:[]}],reports:[],hist:[]})}
 document.addEventListener('DOMContentLoaded',function(){var b=document.createElement('div');
  b.style.cssText='position:sticky;top:0;z-index:99;background:#5b5bf0;color:#fff;padding:8px 14px;font:600 13px system-ui,sans-serif;text-align:center';
  b.innerHTML='Wersja demonstracyjna: fikcyjne spółki i przykładowe dane. Oryginał działa lokalnie z prawdziwymi notowaniami.';document.body.insertBefore(b,document.body.firstChild)});
})();
</script>

<script>
const $=s=>document.querySelector(s),f=(n,d=2)=>n==null?'—':n.toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d});
const zl=n=>f(n)+' zł',pc=n=>(n>=0?'+':'')+f(n)+'%',cl=n=>n>=0?'up':'dn';
const dt=t=>new Date(t*1000).toLocaleDateString('pl-PL',{day:'numeric',month:'short',year:'numeric'});
const api=async(u,o)=>(await fetch(u,o)).json();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtRep=t=>(t||'').split(/\n{2,}/).map(p=>`<p>${esc(p.trim())}</p>`).join('');

let S=JSON.parse(localStorage.gpw||'{"p":[],"w":[],"reports":[],"hist":[]}');
S.reports=S.reports||[];S.hist=S.hist||[];
[...S.p,...S.w].forEach(x=>{if(!x.lots){x.lots=(x.buy&&x.qty)?[{date:Math.floor(Date.now()/1000),price:x.buy,qty:x.qty}]:[];delete x.buy;delete x.qty}
 x.reports=x.reports||[]});
let tab='p',D={},open_={},newsCache={},newsShown={},divCache={},expRep={},expDivRow={},histPeriod='6m',bannerKind=null,sortSt={col:null,dir:1},sumSort={col:null,dir:1},newsOrder=JSON.parse(localStorage.gpwNewsOrder||'[]'),newsSortMode=0,yearSel=new Date().getFullYear(),ytdCache={},yearDetailsOpen=false,histFilterSym='all',histFilterPeriod='all',histDetail={},histSort={col:null,dir:1};
const save=()=>localStorage.gpw=JSON.stringify(S);
let histBackfilled=false;
[...S.p,...S.w].forEach(x=>x.lots.forEach(l=>{
 const has=S.hist.some(h=>h.sym==x.s&&h.type=='kupno'&&h.date==l.date&&h.price==l.price&&h.qty==l.qty);
 if(!has){S.hist.push({date:l.date,type:'kupno',sym:x.s,name:x.n,qty:l.qty,price:l.price});histBackfilled=true}}));
if(histBackfilled)save();
const lotsQty=x=>x.lots.reduce((a,l)=>a+l.qty,0),lotsCost=x=>x.lots.reduce((a,l)=>a+l.qty*l.price,0);
const ask=p=>api('/api/ai',{method:'POST',body:JSON.stringify({prompt:p})});

const tabLabels={p:'📊 Portfel',s:'🧾 Podsumowanie',h:'📜 Historia',n:'📰 Wiadomości',r:'📄 Raporty',w:'👁 Obserwowane'};
let navOrder=JSON.parse(localStorage.gpwNavOrder||'null')||['p','s','h','n','r','w'];
Object.keys(tabLabels).forEach(k=>{if(!navOrder.includes(k))navOrder.push(k)});
function renderNav(){const nv=$('#nav');
 nv.innerHTML=navOrder.map(k=>`<button data-t="${k}" draggable="true" class="${tab==k?'on':''}">${tabLabels[k]}</button>`).join('');
 let dragK=null;
 nv.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{tab=b.dataset.t;renderNav();render()};
  b.ondragstart=()=>{dragK=b.dataset.t;b.style.opacity=.4};
  b.ondragend=()=>{b.style.opacity=1};
  b.ondragover=e=>e.preventDefault();
  b.ondrop=e=>{e.preventDefault();if(!dragK||dragK==b.dataset.t)return;
   const from=navOrder.indexOf(dragK),to=navOrder.indexOf(b.dataset.t);
   navOrder.splice(to,0,navOrder.splice(from,1)[0]);localStorage.gpwNavOrder=JSON.stringify(navOrder);renderNav()}})}
renderNav();
let tm;$('#q').oninput=e=>{clearTimeout(tm);const v=e.target.value.trim();if(v.length<2){$('#sug').hidden=true;return}
 tm=setTimeout(async()=>{const r=await api('/api/search?q='+encodeURIComponent(v));const s=$('#sug');
 s.innerHTML=r.length?r.map(x=>`<div data-s="${x.s}" data-n="${esc(x.n)}">${esc(x.n)} <small class="mut">${x.s.replace('.WA','')}</small></div>`).join(''):'<div class="mut">Brak wyników na GPW</div>';s.hidden=false;
 s.querySelectorAll('[data-s]').forEach(d=>d.onclick=()=>addStock(d.dataset.s,d.dataset.n,tab=='w'?'w':'p'))},250)};
document.addEventListener('click',e=>{if(!e.target.closest('.add'))$('#sug').hidden=true});
function addStock(s,n,k){if(![...S.p,...S.w].some(x=>x.s==s)){S[k].push({s,n,lots:[],reports:[]});save()}
 $('#sug').hidden=true;$('#q').value='';load()}

$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
 a.download='portfel-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('#im').onclick=()=>$('#imf').click();
$('#imf').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
 if(!Array.isArray(j.p)||!Array.isArray(j.w))throw 0;if(!confirm('Zastąpić obecny portfel zaimportowanym?'))return;
 S={p:j.p,w:j.w,reports:j.reports||[],hist:j.hist||[]};[...S.p,...S.w].forEach(x=>{x.lots=x.lots||[];x.reports=x.reports||[]});save();load()}catch(x){alert('To nie wygląda na plik portfela z tej aplikacji.')}};r.readAsText(fl);e.target.value=''};

async function load(){
 await Promise.all([...S.p,...S.w].map(async x=>{try{const c=await api('/api/chart?s='+x.s+'&r=1d');
  D[x.s]=Object.assign(D[x.s]||{},{price:c.price,prev:c.prev,err:c.price==null,stale:c.stale});
  if(!D[x.s].div)D[x.s].div=await api('/api/div?s='+x.s)}catch(e){D[x.s]=Object.assign(D[x.s]||{},{err:true})}}));
 $('#upd').textContent='Odświeżono '+new Date().toLocaleTimeString('pl-PL');render()}

function sortArr(arr){if(!sortSt.col)return arr;
 const key=x=>{const d=D[x.s]||{},q=lotsQty(x);
  switch(sortSt.col){case 'name':return x.n.toLowerCase();case 'price':return d.price||0;
   case 'chg':return d.price&&d.prev?d.price/d.prev-1:0;
   case 'value':return (d.price||0)*q;
   case 'gain':return (d.price||0)*q-lotsCost(x);
   default:return 0}};
 return [...arr].sort((a,b)=>{const A=key(a),B=key(b);return A<B?-sortSt.dir:A>B?sortSt.dir:0})}

function totals(){let v=0,c=0;S.p.forEach(x=>{const d=D[x.s],q=lotsQty(x);if(d&&d.price&&q){v+=d.price*q;c+=lotsCost(x)}});
 $('#tot').textContent=zl(v);const p=v-c,pl=$('#pl');
 pl.innerHTML=c?`<span class="pill ${cl(p)}">${p>=0?'▲':'▼'} ${p>=0?'+':''}${zl(p)} <span style="opacity:.75">(${pc(p/c*100)}%)</span></span> <span class="mut">od momentu zakupu</span>`:'<span class="mut">Dodaj spółki, cenę zakupu i liczbę akcji, żeby zobaczyć wynik</span>';
 return{v,c}}

function divTags(d){if(!d||!d.div)return'';let h='';const n=d.div.next;
 if(n)h+=`<span class="tag d">Dywidenda: dzień ex ${dt(n.date)}${n.amount?', ok. '+zl(n.amount)+' / akcję':''}</span>`;
 d.div.recent.forEach(r=>h+=`<span class="tag">Dywidenda w ostatnim miesiącu: ${dt(r.date)}, ${zl(r.amount)}</span>`);return h}

$('#prep').onclick=async()=>{$('#prep').disabled=true;bannerKind='report';$('#banner').innerHTML='<div class="banner"><span class="mut">Zbieram informacje i przygotowuję przegląd portfela…</span></div>';
 if(!S.p.length){$('#banner').innerHTML='';alert('Portfel jest pusty.');$('#prep').disabled=false;return}
 const names=S.p.map(x=>x.n).join(', ');
 const newsBlocks=await Promise.all(S.p.map(async x=>{let it=newsCache[x.s];if(!it){try{it=await api('/api/news?q='+encodeURIComponent(x.n))}catch(e){it=[]}newsCache[x.s]=it}
  return `${x.n}:\n${it.map(n=>'- '+n.title).join('\n')||'(brak świeżych nagłówków)'}`}));
 const r=await ask(`Jesteś doświadczonym, ale przyjaznym analitykiem rynku, piszesz prosty, ludzki przegląd prasy dla znajomego, który posiada akcje spółek z GPW: ${names}.
Świeże nagłówki dotyczące tych spółek:
${newsBlocks.join('\n\n')}
Napisz po polsku wartościowy, konkretny przegląd — NIE opisuj bieżących cen ani dzisiejszej zmiany kursu. Omów każdą spółkę osobno, zaczynając akapit od jej nazwy, oddzielając akapity PUSTĄ LINIĄ. Dla każdej: co się teraz wokół niej dzieje, jakie są konkretne ryzyka na najbliższe tygodnie/miesiące, jakie konkretne czynniki mogą wspierać wzrost. Na końcu osobny akapit o tym, które branże/sektory teraz wyglądają mocno lub słabo. Pisz prostym, ludzkim językiem, jakbyś tłumaczył znajomemu przy kawie — unikaj żargonu i sztywnego stylu korporacyjnego, unikaj ogólników. Maks. 350 słów, zwykły tekst bez markdown. Na końcu jedno zdanie, że to przegląd informacyjny, nie rekomendacja inwestycyjna.`);
 const txt=r.text||r.error,rep={date:Date.now(),scope:'portfolio',name:'Cały portfel',text:txt};
 S.reports.unshift(rep);save();$('#prep').disabled=false;
 $('#banner').innerHTML=`<div class="banner"><span>✅ Raport portfela gotowy.</span><button class="b" id="gorep">Zobacz w Raportach</button></div>`;
 $('#gorep').onclick=()=>{document.querySelector('nav button[data-t="r"]').click()}};

function render(){const T=totals();const L=$('#list');$('#addbar').hidden=(tab!='p'&&tab!='w');
 if(tab!='w')$('#wsugg').innerHTML='';
 if(tab=='n')return news();
 if(tab=='r')return reportsTab();
 if(tab=='s')return summaryTab(T);
 if(tab=='h')return historyTab();
 const arr=sortArr(S[tab]);
 if(tab=='w'){renderSugg();}
 const cols=tab=='p'?[['name','Spółka'],['price','Cena'],['chg','Zmiana dziś'],['value','Wartość'],['gain','Zysk/strata']]:[['name','Spółka'],['price','Cena'],['chg','Zmiana dziś']];
 const hdr=`<div class="sorthead sorthead-${tab}">${cols.map(([k,l])=>`<div data-sort="${k}">${l}${sortSt.col==k?(sortSt.dir>0?' ▲':' ▼'):''}</div>`).join('')}</div>`;
 if(!arr.length){L.innerHTML=`<div class="empty">Wyszukaj spółkę powyżej, żeby ją dodać.</div>`;return}
 L.innerHTML=hdr+arr.map(x=>{const d=D[x.s]||{},ch=d.price&&d.prev?(d.price/d.prev-1)*100:null,o=open_[x.s],q=lotsQty(x);
  const valGain=tab=='p'?(q&&d.price?`<div>${zl(d.price*q)}</div><div class="${cl(d.price*q-lotsCost(x))}">${d.price*q-lotsCost(x)>=0?'+':''}${zl(d.price*q-lotsCost(x))}<br><small>${pc((d.price*q-lotsCost(x))/lotsCost(x)*100)}</small></div>`:`<div class="mut">brak pozycji</div><div></div>`):'';
  const rmBtn=tab=='w'?`<button class="b" data-rmquick="${x.s}" style="position:absolute;top:10px;right:12px;padding:3px 9px;font-size:12px" title="Usuń z obserwowanych">✕</button>`:'';
  return `<div class="row ${ch!=null?(ch>=0?'acc-up':'acc-dn'):''}" style="position:relative" data-s="${x.s}">${rmBtn}<div class="head head-${tab}"><div><span class="tk">${esc(x.n)}</span> <small>${x.s.replace('.WA','')}</small><br>${divTags(d)}</div>
  <div>${d.price?zl(d.price)+(d.stale?' <small class="mut" title="Spółka jeszcze dziś nie handlowała — to ostatni znany kurs">⏳</small>':''):(d.err?'<span class="dn" title="Nie udało się pobrać danych — sprawdź, czy ticker jest poprawny">❌ błąd</span>':'…')}</div><div class="${ch!=null?cl(ch):''}">${ch!=null?pc(ch):''}<br><small class="mut">dziś</small></div>${valGain}</div>
  ${o?body(x,o):''}</div>`}).join('');
 L.querySelectorAll('[data-sort]').forEach(h=>h.onclick=()=>{const k=h.dataset.sort;if(sortSt.col==k)sortSt.dir*=-1;else{sortSt.col=k;sortSt.dir=1}render()});
 L.querySelectorAll('[data-rmquick]').forEach(b=>b.onclick=e=>{e.stopPropagation();const sy=b.dataset.rmquick;S.w=S.w.filter(y=>y.s!=sy);save();render()});
 L.querySelectorAll('.head').forEach(h=>h.onclick=()=>{const s=h.parentNode.dataset.s;open_[s]=open_[s]?null:{r:'1d',sec:'ch'};render()});
 wireRows();
 Object.keys(open_).forEach(s=>{const o=open_[s];if(!o)return;if(o.sec=='ch')draw(s);if(o.sec=='div')loadDiv(s)})}

function histBlock(x,o){
 const items=S.hist.map((h,gi)=>({...h,gi})).filter(h=>h.sym==x.s).sort((a,b)=>a.date-b.date);
 if(!items.length)return'<div class="mut" style="padding:8px 0">Brak historii transakcji.</div>';
 const ei=o.histEditIdx;
 return '<div class="divlist">'+items.map(h=>{
  const gain=h.type=='sprzedaz'&&h.buyPrice!=null?(h.price-h.buyPrice)*h.qty:null;
  const row=`<div class="n" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
   <span>${new Date(h.date*1000).toLocaleDateString('pl-PL')} — ${h.type=='kupno'?'🟢 Kupno':'🔴 Sprzedaż'}: ${h.qty} szt. po ${zl(h.price)}${gain!=null?` <span class="${cl(gain)}">(${gain>=0?'+':''}${zl(gain)})</span>`:''}</span>
   <span><button class="b" data-hedit="${h.gi}" style="padding:3px 9px;font-size:12px">Edytuj</button> <button class="b" data-hdel="${h.gi}" style="padding:3px 9px;font-size:12px">Usuń</button></span></div>`;
  if(ei!=h.gi)return row;
  return row+`<div class="pos" style="margin-left:10px">Data <input type="date" id="hdate" value="${new Date(h.date*1000).toISOString().slice(0,10)}"> Cena <input type="number" step="0.01" id="hprice" value="${h.price}"> Ilość <input type="number" id="hqty" value="${h.qty}">${h.type=='sprzedaz'?` Cena zakupu <input type="number" step="0.01" id="hbuyprice" value="${h.buyPrice??''}">`:''}<button class="b" id="hsave">Zapisz</button><button class="b" id="hcancel">Anuluj</button></div>`;
 }).join('')+'</div>'}

function body(x,o){
 return `<div class="body">
 <div class="sub2">${['ch','lots','div','rep'].map(sc=>`<button class="b sub-b ${o.sec==sc?'on':''}" data-sec="${sc}">${{ch:'Wykres',lots:'Zakupy',div:'Dywidendy',rep:'Raporty'}[sc]}</button>`).join('')}</div>
 ${o.sec=='ch'?`<div class="per">${['1d','5d','1m','6m','1y','5y','max'].map(r=>`<button class="b ${(o.r||'1d')==r?'on':''}" data-r="${r}">${{'1d':'1 dzień','5d':'5 dni','1m':'1 miesiąc','6m':'6 miesięcy','1y':'rok','5y':'5 lat','max':'maksymalny okres'}[r]}</button>`).join('')}</div>
 <div id="pchg" style="font:600 18px/1 -apple-system,sans-serif;margin:4px 0 10px">…</div>
 <div class="chwrap"><svg id="ch" viewBox="0 0 900 260" preserveAspectRatio="none"></svg><div class="tip" id="tip"></div></div>`:''}
 ${o.sec=='lots'?`${lotsQty(x)?`<div class="tag" style="font-size:13px;padding:5px 12px">Śr. kurs zakupu: <b>${zl(lotsCost(x)/lotsQty(x))}</b>${x.lots.length==1?' • kupione '+new Date(x.lots[0].date*1000).toLocaleDateString('pl-PL'):' • '+x.lots.length+' zakupy'}</div>`:''}
 <table class="lots"><tr><th>Data</th><th>Cena</th><th>Ilość</th><th></th></tr>
 ${x.lots.map((l,i)=>`<tr><td>${new Date(l.date*1000).toLocaleDateString('pl-PL')}</td><td>${zl(l.price)}</td><td>${l.qty}</td><td><button class="b" data-edit="${i}">Edytuj</button> <button class="b" data-sell="${i}">Sprzedaj</button></td></tr>`).join('')||'<tr><td colspan="4" class="mut">Brak zapisanych zakupów</td></tr>'}</table>
 ${o.sellIdx!=null?`<div class="pos">Sprzedaż zakupu z ${new Date(x.lots[o.sellIdx].date*1000).toLocaleDateString('pl-PL')} (masz ${x.lots[o.sellIdx].qty} szt.). Ilość do sprzedania <input type="number" id="sqty" value="${x.lots[o.sellIdx].qty}" max="${x.lots[o.sellIdx].qty}" min="1"> Data sprzedaży <input type="date" id="sdate" value="${new Date().toISOString().slice(0,10)}"> Cena sprzedaży <input type="number" step="0.01" id="sprice" value="${D[x.s]&&D[x.s].price||''}"><button class="b" id="sconfirm">Potwierdź sprzedaż</button><button class="b" id="scancel">Anuluj</button></div>`:''}
 <div class="pos">Data <input type="date" id="ldate" value="${o.editIdx!=null?new Date(x.lots[o.editIdx].date*1000).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}"> Cena <input type="number" step="0.01" id="lprice" value="${o.editIdx!=null?x.lots[o.editIdx].price:''}"> Ilość <input type="number" id="lqty" value="${o.editIdx!=null?x.lots[o.editIdx].qty:''}"><button class="b" id="ladd">${o.editIdx!=null?'Zapisz zmiany':'Dodaj zakup'}</button>${o.editIdx!=null?'<button class="b" id="lcancel">Anuluj</button>':''}</div>
 <div class="pos"><button class="b" id="rm">Usuń spółkę z listy</button>${tab=='w'?'<button class="b" id="mv">Przenieś do portfela</button>':''}</div>
 <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"><b style="font-size:13px">Historia transakcji tej spółki</b>${histBlock(x,o)}</div>`:''}
 ${o.sec=='div'?`<div class="divlist" id="divlist">Wczytuję historię…</div>`:''}
 ${o.sec=='rep'?`<button class="b" id="rp">Wygeneruj nowy raport</button><div id="rephist">${x.reports.length?x.reports.map((rr,i)=>repItem(rr,x.s+'-'+i)).join(''):'<div class="mut" style="padding:10px 0">Brak wygenerowanych raportów dla tej spółki.</div>'}</div>`:''}
 </div>`}

function repItem(rr,key){const open=!!expRep[key];
 return `<div class="repitem"><b>${esc(rr.name)}</b> <span class="mut" style="font-size:12px">${new Date(rr.date).toLocaleString('pl-PL')}</span>
 ${open?`<div class="rep">${fmtRep(rr.text)}</div>`:''}
 <div><button class="b" data-toggle="${key}" style="margin-top:6px">${open?'Zwiń':'Czytaj więcej'}</button></div></div>`}

function wireRows(){$('#list').querySelectorAll('.row').forEach(r=>{const s=r.dataset.s,x=[...S.p,...S.w].find(y=>y.s==s),o=open_[s];if(!o)return;
 r.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{o.sec=b.dataset.sec;render()});
 r.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{o.r=b.dataset.r;render()});
 const g=id=>r.querySelector(id);
 if(g('#ladd'))g('#ladd').onclick=()=>{const price=parseFloat(g('#lprice').value),qty=parseFloat(g('#lqty').value),dv=g('#ldate').value;
  if(!price||!qty){alert('Podaj cenę i ilość.');return}const rec={date:Math.floor(new Date(dv).getTime()/1000),price,qty};
  if(o.editIdx!=null){x.lots[o.editIdx]=rec;o.editIdx=null}else{x.lots.push(rec);S.hist.push({date:rec.date,type:'kupno',sym:x.s,name:x.n,qty,price})}
  save();render()};
 if(g('#lcancel'))g('#lcancel').onclick=()=>{o.editIdx=null;render()};
 r.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{o.editIdx=+b.dataset.edit;render()});
 r.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{o.sellIdx=+b.dataset.sell;render()});
 if(g('#scancel'))g('#scancel').onclick=()=>{o.sellIdx=null;render()};
 if(g('#sconfirm'))g('#sconfirm').onclick=()=>{const l=x.lots[o.sellIdx],price=parseFloat(g('#sprice').value),dv=g('#sdate').value,qty=parseFloat(g('#sqty').value);
  if(!price||!qty){alert('Podaj cenę i ilość sprzedaży.');return}
  if(qty>l.qty){alert('Nie możesz sprzedać więcej niż posiadasz w tym zakupie ('+l.qty+' szt.).');return}
  S.hist.push({date:Math.floor(new Date(dv).getTime()/1000),type:'sprzedaz',sym:x.s,name:x.n,qty,price,buyPrice:l.price});
  if(qty>=l.qty)x.lots.splice(o.sellIdx,1);else l.qty-=qty;
  o.sellIdx=null;save();render()};
 if(g('#rm'))g('#rm').onclick=()=>{if(confirm('Usunąć '+x.n+' z listy?')){S.p=S.p.filter(y=>y!=x);S.w=S.w.filter(y=>y!=x);save();render()}};
 if(g('#mv'))g('#mv').onclick=()=>{S.w=S.w.filter(y=>y!=x);S.p.push(x);save();tab='p';renderNav();render()};
 if(g('#rp'))g('#rp').onclick=()=>report(x,g('#rephist'));
 r.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{expRep[b.dataset.toggle]=!expRep[b.dataset.toggle];render()});
 r.querySelectorAll('[data-hedit]').forEach(b=>b.onclick=()=>{o.histEditIdx=+b.dataset.hedit;render()});
 r.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{if(confirm('Usunąć ten wpis z historii?')){S.hist.splice(+b.dataset.hdel,1);save();render()}});
 if(g('#hcancel'))g('#hcancel').onclick=()=>{o.histEditIdx=null;render()};
 if(g('#hsave'))g('#hsave').onclick=()=>{const h=S.hist[o.histEditIdx],dv=g('#hdate').value,price=parseFloat(g('#hprice').value),qty=parseFloat(g('#hqty').value);
  if(!price||!qty){alert('Podaj cenę i ilość.');return}
  h.date=Math.floor(new Date(dv).getTime()/1000);h.price=price;h.qty=qty;
  if(h.type=='sprzedaz'){const bp=g('#hbuyprice');if(bp)h.buyPrice=parseFloat(bp.value)||h.buyPrice}
  o.histEditIdx=null;save();render()}})}

async function loadDiv(s){const el=document.querySelector(`.row[data-s="${s}"] #divlist`);if(!el)return;
 try{const h=await api('/api/divhist?s='+s);el.innerHTML=h.length?h.map(v=>`<div class="n">${dt(v.date)} — <b>${zl(v.amount)}</b> / akcję</div>`).join(''):'<div class="mut">Brak danych o wypłaconych dywidendach.</div>'}
 catch(e){el.innerHTML='<div class="mut">Nie udało się pobrać historii.</div>'}}

function fmtX(r,t){const d=new Date(t*1000);
 if(r=='1d')return d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
 if(r=='5d'||r=='1m')return d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'});
 if(r=='6m'||r=='1y')return d.toLocaleDateString('pl-PL',{month:'short'});
 return d.toLocaleDateString('pl-PL',{month:'short',year:'2-digit'})}

async function draw(s){const o=open_[s];if(!o||o.sec!='ch')return;const r=o.r||'1d';
 const row=document.querySelector(`.row[data-s="${s}"]`);if(!row)return;
 try{const c=await api(`/api/chart?s=${s}&r=${r}`);const p=c.pts;const svg=row.querySelector('#ch');if(!p.length||!svg)return;
 const W=900,H=260,padL=50,padB=24,padT=10,gw=W-padL,gh=H-padT-padB;
 const ys=p.map(a=>a[1]),mn=Math.min(...ys),mx=Math.max(...ys),sp=(mx-mn)||1;
 const X=i=>padL+(p.length>1?i/(p.length-1)*gw:0),Y=v=>padT+gh-(v-mn)/sp*gh;
 const pts=p.map((a,i)=>`${X(i).toFixed(1)},${Y(a[1]).toFixed(1)}`).join(' ');
 const ch=(ys[ys.length-1]/ys[0]-1)*100,col=ch>=0?'var(--up)':'var(--dn)';
 const pchgEl=row.querySelector('#pchg');
 if(pchgEl){const amt=ys[ys.length-1]-ys[0];pchgEl.innerHTML=`<span style="color:${col}">${pc(ch)}% (${amt>=0?'+':''}${f(amt)} zł)</span> <span class="mut" style="font-size:13px;font-weight:400">— ${{'1d':'dzisiaj','5d':'ostatnie 5 dni','1m':'ostatni miesiąc','6m':'ostatnie 6 miesięcy','1y':'ostatni rok','5y':'ostatnie 5 lat','max':'maksymalny okres'}[r]}</span>`}
 const buy=(S.p.find(y=>y.s==s)||{lots:[]}).lots,avgbuy=buy.length?buy.reduce((a,l)=>a+l.price*l.qty,0)/buy.reduce((a,l)=>a+l.qty,0):null;
 const byY=avgbuy&&avgbuy>=mn&&avgbuy<=mx?Y(avgbuy):null;
 const imn=ys.indexOf(mn),imx=ys.indexOf(mx);
 const nlabels=Math.min(6,p.length),step=Math.max(1,Math.floor((p.length-1)/(nlabels-1||1)));
 let xl='';for(let i=0;i<p.length;i+=step)xl+=`<text x="${X(i)}" y="${H-4}" font-size="11" fill="var(--mut)" text-anchor="middle">${fmtX(r,p[i][0])}</text>`;
 let gl='';[mn,mn+sp*.25,mn+sp*.5,mn+sp*.75,mx].forEach(v=>{gl+=`<line x1="${padL}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="0" y="${Y(v)+4}" font-size="11" fill="var(--mut)">${f(v,1)}</text>`});
 svg.innerHTML=`${gl}${xl}<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts}"/>
 ${byY!=null?`<line x1="${padL}" x2="${W}" y1="${byY}" y2="${byY}" stroke="var(--mut)" stroke-dasharray="6 4"/><text x="${W}" y="${byY-4}" font-size="11" fill="var(--mut)" text-anchor="end">śr. zakup ${f(avgbuy,1)}</text>`:''}
 <circle cx="${X(imx)}" cy="${Y(mx)}" r="3" fill="var(--up)"/><circle cx="${X(imn)}" cy="${Y(mn)}" r="3" fill="var(--dn)"/>
 <circle id="hov" r="4" fill="${col}" opacity="0"/><rect x="${padL}" y="0" width="${gw}" height="${H}" fill="transparent" id="hoverzone"/>`;
 const hz=svg.querySelector('#hoverzone'),hov=svg.querySelector('#hov'),tipEl=row.querySelector('.tip');
 hz.onmousemove=e=>{const rect=svg.getBoundingClientRect(),mx2=(e.clientX-rect.left)/rect.width*W;
  let i=Math.round((mx2-padL)/gw*(p.length-1));i=Math.max(0,Math.min(p.length-1,i));
  hov.setAttribute('cx',X(i));hov.setAttribute('cy',Y(p[i][1]));hov.setAttribute('opacity',1);
  tipEl.style.opacity=1;tipEl.style.left=((e.clientX-rect.left)/rect.width*100)+'%';tipEl.style.top=((Y(p[i][1])/H)*100)+'%';
  tipEl.textContent=`${fmtX(r,p[i][0])} · ${f(p[i][1])} zł`};
 hz.onmouseleave=()=>{hov.setAttribute('opacity',0);tipEl.style.opacity=0}}catch(e){}}

async function report(x,el){el.innerHTML='<div class="rep"><p>Zbieram dane i przygotowuję raport…</p></div>';
 const ps=await Promise.all(['1m','6m','1y','5y'].map(r=>api(`/api/chart?s=${x.s}&r=${r}`).catch(()=>null)));
 const st=ps.map((c,i)=>c&&c.pts.length?`${['1 mies.','6 mies.','1 rok','5 lat'][i]}: ${pc((c.price/c.pts[0][1]-1)*100)}`:'').join('; ');
 const nw=await api('/api/news?q='+encodeURIComponent(x.n)).catch(()=>[]),d=D[x.s]||{};
 const r=await ask(`Jesteś doświadczonym, przyjaznym analitykiem rynku. Spółka: ${x.n} (${x.s}), notowana na GPW. Zmiany kursu w czasie: ${st}. Dywidendy: ${JSON.stringify(d.div)}. Świeże nagłówki: ${nw.map(n=>n.title).join(' | ')||'(brak świeżych nagłówków)'}.

function divReceivedHist(sym,divArr){let total=0;

  if(held>0)total+=held*dv.amount});

 L.innerHTML='<div class="row" style="padding:16px 18px"><div class="mut">Szukam wiadomości…</div></div>';
 const per=await Promise.all(all.map(async x=>{let it=newsCache[x.s];if(!it){try{it=await api('/api/news?q='+encodeURIComponent(x.n))}catch(e){it=[]}newsCache[x.s]=it}
  let sel=it.filter(n=>n.hot);if(!sel.length)sel=it.slice(0,3);return{sym:x.s,name:x.n,items:sel.slice(0,4)}}));
 let mkt=newsCache['__mkt'];if(!mkt){try{mkt=await api('/api/news?q='+encodeURIComponent('GPW Warszawa giełda WIG'))}catch(e){mkt=[]}newsCache['__mkt']=mkt}
 let mktSel=mkt.filter(n=>n.hot);if(!mktSel.length)mktSel=mkt.slice(0,4);
 let sections=[...per,{sym:'__mkt',name:'Rynek GPW',items:mktSel}];
 if(newsSortMode){sections.sort((a,b)=>a.name.localeCompare(b.name,'pl')*newsSortMode)}
 else sections.sort((a,b)=>{const ia=newsOrder.indexOf(a.sym),ib=newsOrder.indexOf(b.sym);
  if(ia==-1&&ib==-1)return 0;if(ia==-1)return 1;if(ib==-1)return -1;return ia-ib});
 const item=n=>`<div class="n">${n.hot?'<span style="color:var(--dn);font-weight:700">❗ </span>':''}<a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><br><small class="mut">${esc(n.date?.slice(5,16))}</small></div>`;
 L.innerHTML=`<div class="sub2"><button class="b ${!newsSortMode?'on':''}" id="nsCustom">Kolejność własna</button><button class="b" id="nsAZ">${newsSortMode==1?'A→Z ✓':'Sortuj A→Z'}</button><button class="b" id="nsZA">${newsSortMode==-1?'Z→A ✓':'Sortuj Z→A'}</button></div>
 <div class="news">`+
  sections.map(p=>`<div class="ncomp" draggable="true" data-sym="${p.sym}"><h3><span class="mut" style="cursor:grab" title="Przeciągnij, by zmienić kolejność">⠿</span> ${esc(p.name)}</h3>${p.items.length?p.items.map(item).join(''):`<div class="mut" style="margin-bottom:10px">Brak istotnych wiadomości.</div>`}</div>`).join('')+
  '</div>';
 $('#nsCustom').onclick=()=>{newsSortMode=0;render()};
 $('#nsAZ').onclick=()=>{newsSortMode=1;render()};
 $('#nsZA').onclick=()=>{newsSortMode=-1;render()};
 let dragSym=null;
 L.querySelectorAll('.ncomp').forEach(el=>{
  el.ondragstart=()=>{dragSym=el.dataset.sym;el.style.opacity=.4};
  el.ondragend=()=>{el.style.opacity=1};
  el.ondragover=e=>e.preventDefault();
  el.ondrop=e=>{e.preventDefault();if(!dragSym||dragSym==el.dataset.sym)return;
   const order=sections.map(x=>x.sym),from=order.indexOf(dragSym),to=order.indexOf(el.dataset.sym);
   order.splice(to,0,order.splice(from,1)[0]);newsOrder=order;newsSortMode=0;localStorage.gpwNewsOrder=JSON.stringify(order);render()}})}

load();setInterval(load,60000);
</script></body></html>
