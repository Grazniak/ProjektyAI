<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Włoski krok po kroku</title>
<style>
:root{
--bg:#f4f3ee;--bg2:#eae7de;--card:#ffffff;--tx:#171b17;--mut:#767e75;--mut2:#9aa198;
--ac:#0f7a52;--ac2:#3fb37f;--red:#c14a3f;--warn:#c07f22;--bd:#e6e2d6;--soft:#e4f2ea;
--shadow:0 1px 2px rgba(30,35,25,.04),0 10px 28px -14px rgba(30,35,25,.16);
--shadow-sm:0 1px 2px rgba(30,35,25,.05);
--grad:linear-gradient(135deg,var(--ac),var(--ac2));
}
@media(prefers-color-scheme:dark){:root{
--bg:#121512;--bg2:#191d19;--card:#1c211c;--tx:#eef1ec;--mut:#9aa397;--mut2:#6d766c;
--ac:#3fcf8e;--ac2:#22a86a;--red:#e2695d;--warn:#e3a13f;--bd:#2b312a;--soft:#1c2c22;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.55);
--shadow-sm:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;background:
radial-gradient(1200px 500px at 50% -10%,var(--bg2),var(--bg));color:var(--tx);-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:0 16px 70px}
header{position:sticky;top:0;z-index:20;padding:18px 16px 10px;margin:0 -16px;backdrop-filter:blur(16px) saturate(160%);
background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}
h1{font:800 22px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 12px;
background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
h2{font:700 17px/1.3 -apple-system,system-ui,sans-serif;letter-spacing:-.01em;margin:24px 2px 10px;color:var(--tx)}
nav{display:flex;gap:3px;flex-wrap:wrap;background:var(--bg2);padding:4px;border-radius:14px;border:1px solid var(--bd)}
nav button{background:none;border:0;padding:8px 13px;font:600 13.5px/1 inherit;color:var(--mut);cursor:pointer;border-radius:10px;transition:all .18s ease;white-space:nowrap}
nav button.on{color:#fff;background:var(--grad);box-shadow:var(--shadow-sm)}
nav button:not(.on):hover{color:var(--tx);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;margin:10px 0;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
button.b{background:var(--grad);color:#fff;border:0;border-radius:999px;padding:10px 20px;font:700 14.5px inherit;cursor:pointer;
box-shadow:0 4px 14px -4px color-mix(in srgb,var(--ac) 60%,transparent);transition:transform .12s,box-shadow .12s;letter-spacing:-.01em}
button.b:hover{box-shadow:0 6px 18px -4px color-mix(in srgb,var(--ac) 70%,transparent);transform:translateY(-1px)}
button.b:active{transform:translateY(0) scale(.97)}
button.b.g{background:none;color:var(--ac);border:1.5px solid var(--bd);box-shadow:none}
button.b.g:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent);transform:translateY(-1px)}
button.b:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.ph{color:var(--ac);font-style:italic;font-weight:500}.mut{color:var(--mut);font-size:14px}
.bar{height:9px;background:var(--bg2);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .4s ease}
.lock{opacity:.4;filter:saturate(.7)}.ok{color:var(--ac);font-weight:700}.no{color:var(--red);font-weight:700}
.card.done{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 6%,var(--card)),var(--card));box-shadow:var(--shadow-sm),inset 3px 0 0 var(--ac)}
.card.next{box-shadow:var(--shadow),inset 3px 0 0 var(--ac);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.card.pass{box-shadow:var(--shadow-sm),inset 3px 0 0 var(--ac)}
.card.fail{box-shadow:var(--shadow-sm),inset 3px 0 0 var(--warn)}
.mbar{height:6px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:10px}
.mbar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .4s ease}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.stat b{display:block;font:800 25px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;
background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:12px 0}
input.t,textarea.t{font:inherit;padding:12px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:100%;margin:10px 0;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
textarea.t{resize:vertical;font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.4}
input.t:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 15%,transparent)}
input.in{width:140px;display:inline-block;margin:0 4px;padding:5px 10px;border-radius:8px}
.big{font:700 27px/1.3 -apple-system,system-ui,sans-serif;letter-spacing:-.01em}
.sp{cursor:pointer;background:var(--soft);border:0;font-size:16px;width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:4px;transition:transform .15s}
.sp:hover{transform:scale(1.08)}.sp:active{transform:scale(.94)}
.tk{border-bottom:2px dotted var(--mut2);position:relative;cursor:help}
.tk:hover::after{content:attr(data-t);position:absolute;left:0;top:calc(100% + 4px);background:var(--tx);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:13px;white-space:nowrap;z-index:9;font-style:normal;font-weight:600;box-shadow:var(--shadow)}
.fb{padding:12px 14px;border-radius:14px;margin:10px 0;background:var(--soft)}
.tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ac);letter-spacing:.01em}
details.card summary{list-style:none}details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";float:right;color:var(--mut);font-size:20px;transition:transform .2s;margin-top:-3px}
details.card[open] summary::after{transform:rotate(90deg)}
select{font:600 13.5px inherit;padding:6px 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx)}
a{color:var(--ac)}
.ni{position:relative;display:inline-block;margin-left:3px;vertical-align:middle}
.ni summary{cursor:pointer;color:var(--ac);font:700 15px inherit;list-style:none;user-select:none;line-height:1}
.ni summary::-webkit-details-marker{display:none}
.ni .note{display:none;position:absolute;left:0;top:135%;background:var(--tx);color:var(--bg);padding:9px 12px;border-radius:12px;font-size:12.5px;font-style:normal;font-weight:500;width:240px;z-index:30;box-shadow:var(--shadow);line-height:1.45}
.ni[open] .note{display:block}
</style></head><body><main>

</main>

function buildD(){const d={};L.forEach(l=>l.w.forEach(w=>d[clean(w[0])]=w));X.forEach(w=>d[clean(w[0])]=w);return d}

function loadS(lang){let s;try{s=JSON.parse(localStorage.getItem("wl2_"+lang))}catch(e){}s=s||{done:{},test:{},w:{}};
Object.keys(s.w).forEach(k=>{const o=s.w[k];if(o&&typeof o.b=="number"){s.w[k]={p:{b:o.b,d:o.d},r:{b:o.b,d:o.d}}}});
Object.keys(s.w).forEach(k=>["p","r"].forEach(dir=>{const b=s.w[k][dir];if(b&&b.d){const dt=new Date(b.d);dt.setHours(0,0,0,0);b.d=dt.getTime()}}));
s.stats=s.stats||{minutes:0,days:{},testLog:[]};
return s}

const dkey=d=>new Date(d).toLocaleDateString("sv-SE");
const markToday=(mins)=>{const k=dkey(Date.now());S.stats.days[k]=true;S.stats.dayMin=S.stats.dayMin||{};S.stats.dayMin[k]=(S.stats.dayMin[k]||0)+mins};
const streak=()=>{let n=0,d=Date.now();if(!S.stats.days[dkey(d)])d-=864e5;while(S.stats.days[dkey(d)]){n++;d-=864e5}return n};
const bumpToday=ok=>{const k=dkey(Date.now());if(!S.stats.today||S.stats.today.d!==k)S.stats.today={d:k,ok:0,n:0};S.stats.today.n++;if(ok)S.stats.today.ok++};
const todayStats=()=>{const k=dkey(Date.now());return(S.stats.today&&S.stats.today.d===k)?S.stats.today:{d:k,ok:0,n:0}};

const $=s=>document.querySelector(s),app=$("#app");let tab="learn",Q=null;

const pickV=()=>{const l=iv();return l.find(v=>v.name==S.voice)||l.find(v=>/premium|enhanced|ulepsz/i.test(v.name))||l.find(v=>LANGS[LANG].voiceNames.test(v.name))||l[0]};
const say=t=>{try{const ss=speechSynthesis;if(ss.speaking)ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[LANG].code;u.rate=.85;const v=pickV();if(v)u.voice=v;ss.speak(u)}catch(e){}};
function setLang(lang){if(lang==LANG)return;LANG=lang;localStorage.setItem("wl_lang",lang);L=LANGS[lang].L;X=LANGS[lang].X;TX=LANGS[lang].TX;GR=LANGS[lang].GR;D=buildD();allW=buildAllW();S=loadS(lang);save();tab="learn";Q=null;renderChrome();render()}
function renderChrome(){const t=$("#title"),n=$("#langsw"),nm=LANG=="it"?"Włoski":"Angielski";document.title=`${nm} krok po kroku`;if(t)t.innerHTML=`${LANGS[LANG].flag} ${nm} krok po kroku`;

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const IVL=[0,1,3,7,14,30];
const dayStart=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime()};
const srs=(it,dir,ok)=>{const o=S.w[it]||(S.w[it]={p:{b:0,d:0,ld:""},r:{b:0,d:0,ld:""}});const box=o[dir];const today=dkey(Date.now());
if(!ok){box.b=1;box.d=dayStart(IVL[1]);box.ld=today;return"reset"}
if(box.ld===today)return"capped";
const b=Math.min(5,box.b+1);box.b=b;box.d=dayStart(IVL[b]);box.ld=today;return"advanced"};
const due=()=>{const r=[];Object.keys(S.w).forEach(w=>["p","r"].forEach(dir=>{const b=S.w[w][dir];if(b&&b.d<=Date.now())r.push({w,dir})}));return r};
const spk=t=>`<button class="sp" data-say="${t}" title="Posłuchaj">🔊</button>`;
const noteHtml=w=>w[3]?`<details class="ni"><summary>ⓘ</summary><div class="note">${w[3]}</div></details>`:"";
function toks(s){const w=s.split(" "),r=[];for(let i=0;i<w.length;){let hit=0;for(let n=Math.min(3,w.length-i);n>=1;n--){const c=w.slice(i,i+n).join(" "),k=clean(c);if(D[k]){r.push({t:c,k});i+=n;hit=1;break}}if(!hit)r.push({t:w[i++],k:null})}return r}
const tkHtml=(t,bi)=>t.k?(bi!==false&&bi!==undefined?`<input class="t in" id="ans${bi}" autocomplete="off">`:`<span class="tk" data-t="${D[t.k][1]} · [${D[t.k][2]}]">${t.t}</span>`):t.t;
const sent=s=>toks(s).map(t=>tkHtml(t)).join(" ");
const items=()=>{const a=[];L.forEach((l,i)=>{a.push({k:"l",i});if(i%3==2)a.push({k:"t",i})});return a};

function render(){nav();if(Q)return quiz();({learn:vLearn,rev:vRev,words:vWords,known:vKnown,intro:vIntro,postep:vProgress,gram:vGrammar}[tab])()}
function vGrammar(){app.innerHTML=`<p class="mut">Krótka ściąga — wzorce, które pojawiają się w zdaniach i słówkach, zebrane w jednym miejscu. To nie jest pełny kurs gramatyki, tylko tyle, żeby rozumieć, dlaczego słowo wygląda czasem inaczej.</p>`+GR.map(g=>`<div class="card"><b>${g.t}</b><p style="margin:8px 0">${g.p}</p><div class="ph">${g.ex}</div><div class="mut">${g.exPl}</div></div>`).join("")}

function vLearn(){const it=items(),learned=Object.values(S.w).filter(o=>o.p.b>=3&&o.r.b>=3).length,dn=Object.keys(S.done).length,st=streak(),ts=todayStats();
let h=`<div class="card"><div class="row"><b>Postęp kursu</b><span class="mut">${dn}/${L.length} lekcji · ${learned}/${allW.length} słówek nauczonych${st?` · 🔥 seria ${st} dni`:""}</span></div><div class="bar" style="margin-top:8px"><i style="width:${dn/L.length*100}%"></i></div>
${ts.n?`<div class="row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)"><span class="mut">Dzisiejsza sesja</span><span><b>${ts.ok}/${ts.n}</b> <span class="mut">poprawnych (${Math.round(ts.ok/ts.n*100)}%)</span></span></div>`:""}</div>`;
let ok=true,shownNext=false;it.forEach(x=>{if(x.k=="l"&&x.i%3==0){const n=x.i/3+1;h+=`<h2>Poziom ${n<=4?"A1."+n:"A2."+(n-4)}</h2>`}const d=isDone(x),open=ok,isNext=open&&!d&&!shownNext;if(isNext)shownNext=true;
if(x.k=="l"){const ws=L[x.i].w,mk=ws.filter(w=>S.w[w[0]]&&S.w[w[0]].p.b>=3&&S.w[w[0]].r.b>=3).length,pct=Math.round(mk/ws.length*100);

else{const sc=S.test["t"+x.i],passed=sc>=80;h+=`<div class="card ${open?(passed?"pass":sc!=null?"fail":isNext?"next":""):"lock"}" style="background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 4%,var(--card)),var(--card))"><div class="row"><div><b>${passed?"✅ ":""}Test: lekcje ${x.i-1}–${x.i+1}</b><div class="mut">${testItems(x.i).length} pytań (dopasowane do Twoich braków — prawie wszystkie słowa z tych lekcji, więcej powtórzeń tam, gdzie idzie Ci słabiej), próg zaliczenia 80%${sc!=null?` · najlepszy wynik: <span class="${passed?"ok":"no"}">${sc}%</span>`:""}</div></div>${open?`<button class="b ${d?"g":""}" data-act="test" data-i="${x.i}">${d?"Jeszcze raz":"Zacznij test"}</button>`:"🔒"}</div></div>`}
if(!d)ok=false});

let Q0=0;

function mkq(w,dir){return {t:dir,w}}
function cloze(s,n){n=n||1;const t=toks(s[0]);const all=t.map((x,i)=>x.k?i:null).filter(x=>x!==null);
const strong=all.filter(i=>t[i].t.replace(/[^\p{L}]/gu,"").length>=4);
const pool=shuf((strong.length>=n?strong:all).slice());
const bis=pool.slice(0,n).sort((a,b)=>a-b);
return {t:"cloze",s,tk:t,bis}}
function adaptiveQs(words){let qs=[];
words.forEach(w=>{const o=S.w[w[0]],pb=o?o.p.b:0,rb=o?o.r.b:0;
if(pb<3&&rb<3){qs.push(mkq(w,"pl2it"));qs.push(mkq(w,"it2pl"))}
else if(pb<rb)qs.push(mkq(w,"pl2it"));
else if(rb<pb)qs.push(mkq(w,"it2pl"));

function testItems(i){const idxs=[i-2,i-1,i],words=idxs.flatMap(li=>L[li].w);

function begin(kind,qs,extra){Q=Object.assign({kind,queue:shuf(qs),n:qs.length,ok:0,fb:null,start:Date.now()},extra||{});render()}

function quiz(){const q=Q.queue[0];if(!q)return finish();
const done=Q.n-Q.queue.length,pct=done/Q.n*100;let p="",ph="";

else if(q.t=="it2pl")p=`<div class="mut">Co to znaczy?</div><div class="big">${q.w[0]} ${spk(q.w[0])}${noteHtml(q.w)}</div><div class="ph">[${q.w[2]}]</div>`;

const givenLine=!Q.fb.ok&&given?`<div class="mut" style="margin-bottom:4px">Twoja odpowiedź: <span class="no">${given}</span></div>`:"";
f=`<div class="fb">${givenLine}<b class="${Q.fb.ok?"ok":"no"}">${Q.fb.ok?"Dobrze!":"Poprawna odpowiedź:"}</b> ${Q.fb.ok?"":a} <span class="ph">[${pp}]</span></div><button class="b" data-act="next">Dalej</button>`}
else f=`<button class="b" data-act="check">Sprawdź</button> <button class="b g" data-act="peek">Nie wiem</button>`;

if(Q.fb)ids.forEach(id=>{const el=$("#"+id);if(el)el.disabled=true});
else{const el=$("#"+ids[0]);if(el)el.focus()}}

function check(peek){const q=Q.queue[0];let ok=false,given=null;
if(!peek){
if(q.t=="pl2it"){given=[$("#ans0").value];ok=norm(given[0])==norm(q.w[0])}
else if(q.t=="it2pl"){given=[$("#ans0").value];ok=q.w[1].split("/").some(x=>norm(x)==norm(given[0]))}
else{given=q.bis.map((idx,k)=>$("#ans"+k).value);ok=q.bis.every((idx,k)=>norm(given[k])==norm(q.tk[idx].t))}
}
Q.fb={ok,given};bumpToday(ok);if(q.t!="cloze"&&!q.retry){const r=srs(q.w[0],q.t=="pl2it"?"p":"r",ok);if(r=="capped")Q.capped=(Q.capped||0)+1}
if(ok&&!q.retry)Q.ok++;save();quiz();if(!Q.fb.ok)0}
function next(){const q=Q.queue.shift();if(!Q.fb.ok&&Q.kind!="test"){q.retry=true;Q.queue.push(q)}Q.fb=null;quiz()}

function finish(){let h="",pct=Math.round(Q.ok/Q.n*100);
const mins=Math.max(1,Math.round((Date.now()-Q.start)/60000));S.stats.minutes+=mins;markToday(mins);
if(Q.kind=="lesson"){S.done[Q.i]=true;L[Q.i].w.forEach(w=>{if(!S.w[w[0]])S.w[w[0]]={p:{b:1,d:dayStart(1)},r:{b:1,d:dayStart(1)}}});save();h=`<h2>Lekcja ukończona 🎉</h2><p>Bez pomyłek: ${pct}%. Słówka trafiły do powtórek — wrócą jutro.</p>`}
else if(Q.kind=="test"){const id="t"+Q.i,pass=pct>=80;S.test[id]=Math.max(S.test[id]||0,pct);S.stats.testLog.push({i:Q.i,pct,d:Date.now()});if(S.stats.testLog.length>30)S.stats.testLog.shift();save();h=`<h2>${pass?"Test zaliczony 🎉":"Jeszcze nie tym razem"}</h2><p>Wynik: <b class="${pass?"ok":"no"}">${pct}%</b>. ${pass?"Odblokowano kolejny poziom.":"Potrzeba 80%. Powtórz słówka i spróbuj ponownie."}</p>`}
else{save();h=`<h2>Powtórki zakończone</h2><p>Bez pomyłek: ${pct}%.</p>`}
if(Q.capped)h+=`<p class="mut">ℹ️ ${Q.capped} ${Q.capped==1?"słówko było":"słówek było"} dziś już ćwiczone wcześniej — ich termin kolejnej powtórki się nie zmienił (jeden awans na dzień, żeby odstępy były realne). Wrócą z nowym terminem jutro.</p>`;
Q=null;tab="learn";app.innerHTML=h+`<button class="b" data-act="back">Wróć do nauki</button>`;nav()}

function vProgress(){const dn=Object.keys(S.done).length,mastered=Object.values(S.w).filter(o=>o.p.b>=3&&o.r.b>=3).length;
const pAvg=allW.length?Math.round(Object.values(S.w).reduce((a,o)=>a+o.p.b,0)/allW.length/5*100):0;
const rAvg=allW.length?Math.round(Object.values(S.w).reduce((a,o)=>a+o.r.b,0)/allW.length/5*100):0;
const h=Math.floor(S.stats.minutes/60),m=S.stats.minutes%60;const today=(S.stats.dayMin&&S.stats.dayMin[dkey(Date.now())])||0;const ts=todayStats();
let out=`<h2>Twoje postępy</h2><div class="grid">
<div class="stat"><b>${dn}/${L.length}</b>lekcji</div>
<div class="stat"><b>${mastered}</b>słówek opanowanych</div>
<div class="stat"><b>${today}min</b>dzisiaj</div>
<div class="stat"><b>${h?h+"g ":""}${m}min</b>łącznie</div>
<div class="stat"><b>🔥 ${streak()}</b>dni serii</div>
</div>
${ts.n?`<h2>Dzisiejsza sesja</h2><div class="card"><div class="row"><span>Odpowiedzi dziś</span><b>${ts.ok}/${ts.n}</b></div><div class="bar" style="margin-top:8px"><i style="width:${Math.round(ts.ok/ts.n*100)}%"></i></div><p class="mut" style="margin:8px 0 0">To licznik Twojego dzisiejszego wysiłku — rośnie przy każdej odpowiedzi, niezależnie od dziennego limitu w „opanowaniu". Osobny wskaźnik dla osobnej rzeczy: to pokazuje ile dziś ćwiczyłeś, nie jak trwale to zapamiętasz.</p></div>`:""}
<h2>Opanowanie kierunków</h2>
<div class="card"><div class="row"><span>Pisanie (PL→IT)</span><span class="mut">${pAvg}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${pAvg}%"></i></div>
<div class="row" style="margin-top:12px"><span>Rozpoznawanie (IT→PL)</span><span class="mut">${rAvg}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${rAvg}%"></i></div></div>
<h2>Wyniki testów</h2>`;
const log=S.stats.testLog.slice().reverse();
out+=log.length?log.map(t=>`<div class="card row ${t.pct>=80?"pass":"fail"}"><div>Test: lekcje ${t.i-1}–${t.i+1}<div class="mut">${new Date(t.d).toLocaleDateString("pl-PL")}</div></div><b class="${t.pct>=80?"ok":"no"}">${t.pct}%</b></div>`).join(""):`<div class="card mut">Jeszcze żadnego testu.</div>`;
out+=`<h2>Synchronizacja między urządzeniami</h2>
<div class="card"><p class="mut" style="margin:0 0 12px">Postęp jest zapisany osobno w każdej przeglądarce (np. osobno na Macu, osobno na iPhonie). Żeby przenieść go na inne urządzenie: tu wygeneruj kod, skopiuj go (np. przez Notatki albo wiadomość do siebie), a na drugim urządzeniu wklej go w to samo pole i zaimportuj. Obejmuje postęp w obu językach naraz.</p>
<button class="b g" data-act="exportcode">Wygeneruj kod</button>
<textarea id="synccode" class="t" style="min-height:76px" placeholder="Tu pojawi się kod po kliknięciu wyżej — albo wklej tu kod z innego urządzenia"></textarea>
<button class="b" data-act="importcode">Zaimportuj wklejony kod</button>
<div id="syncmsg" style="margin-top:10px;font-size:14px"></div>
</div>`;
app.innerHTML=out}
function vRev(){const d=due();const np=d.filter(x=>x.dir=="p").length,nr=d.filter(x=>x.dir=="r").length;
if(!d.length){const nx=Object.values(S.w).flatMap(o=>[o.p.d,o.r.d]).sort()[0];app.innerHTML=`<div class="card">Brak słówek do powtórki.${nx?` Następne będą gotowe ${new Date(nx).toLocaleDateString("pl-PL")}.`:" Ukończ pierwszą lekcję, aby zacząć."}</div>`;return}
app.innerHTML=`<div class="card"><p>Do powtórki: <b>${d.length}</b> (pisanie PL→IT: ${np} · rozpoznawanie IT→PL: ${nr}). Odstępy rosną (1, 3, 7, 14, 30 dni), gdy odpowiadasz poprawnie — każdy kierunek ma własny harmonogram.</p><button class="b" data-act="rev">Zacznij powtórkę</button></div>`}
function wrow(x){const o=S.w[x.w[0]];const pb=o?o.p.b:0,rb=o?o.r.b:0;return `<div class="card row"><div>${spk(x.w[0])}<b>${x.w[0]}</b> <span class="ph">[${x.w[2]}]</span>${noteHtml(x.w)}</div><div style="text-align:right">${x.w[1]}<br><span class="tag">pisanie ${pb}/5</span> <span class="tag">rozpoznanie ${rb}/5</span></div></div>`}
function vWords(){const mix=`<details class="card"><summary style="cursor:pointer"><b>🎛️ Własna powtórka</b> <span class="mut">(wybierz lekcje, np. 1, 3 i 4)</span></summary>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">${L.map((l,i)=>`<label style="display:flex;align-items:center;gap:5px;background:var(--bg2);padding:6px 10px;border-radius:10px;font-size:13px;cursor:pointer"><input type="checkbox" class="mixchk" value="${i}" style="accent-color:var(--ac)">${i+1}. ${l.t}</label>`).join("")}</div>
<button class="b" data-act="mixrev">Zacznij powtórkę z wybranych</button></details>`;
app.innerHTML=mix+`<input class="t" id="q" placeholder="Szukaj słówka…">`+`<div id="wl"></div>`;
const f=()=>{const v=norm($("#q").value);
$("#wl").innerHTML=L.map((l,i)=>{const r=allW.filter(x=>x.i==i&&(!v||norm(x.w[0]).includes(v)||norm(x.w[1]).includes(v)));if(!r.length)return"";
const known=r.filter(x=>S.w[x.w[0]]&&S.w[x.w[0]].p.b>=3&&S.w[x.w[0]].r.b>=3).length;
return `<details class="card" ${v?"open":""}><summary style="cursor:pointer"><b>Lekcja ${i+1}: ${l.t}</b> <span class="mut">(${r.length} słówek · ${known} opanowanych)</span></summary><div class="row" style="margin-top:10px"><span class="mut">Powtórka tylko z tej lekcji</span><button class="b g" data-act="lrev" data-i="${i}">Powtórka</button></div>${r.map(wrow).join("")}</details>`}).join("")};
$("#q").oninput=f;f()}
function vKnown(){const r=allW.filter(x=>S.w[x.w[0]]&&S.w[x.w[0]].p.b>=3&&S.w[x.w[0]].r.b>=3);app.innerHTML=`<p class="mut">Słówka opanowane w obu kierunkach — pisanie i rozpoznawanie (${r.length}).</p>`+(r.map(wrow).join("")||`<div class="card">Jeszcze puste. Słowo trafia tu, gdy oba kierunki osiągną 3/5.</div>`)}

document.addEventListener("click",e=>{const t=e.target.closest("[data-say],[data-act],[data-tab],[data-lang]");if(!t)return;e.preventDefault();
if(t.dataset.lang)return setLang(t.dataset.lang);
if(t.dataset.say)return say(t.dataset.say);
if(t.dataset.tab){Q=null;tab=t.dataset.tab;return render()}
const a=t.dataset.act,i=+t.dataset.i;
if(a=="intro"){Q0=i;tab="intro";render()}
else if(a=="start"){const l=L[i];begin("lesson",[...l.w.flatMap(w=>[mkq(w,"pl2it"),mkq(w,"it2pl")]),...l.s.map(cloze)],{i,title:"Lekcja "+(i+1)})}
else if(a=="test"){begin("test",testItems(i),{i,title:"Test"})}
else if(a=="rev"){const d=shuf(due()).slice(0,24);begin("rev",d.map(x=>mkq(D[clean(x.w)],x.dir=="p"?"pl2it":"it2pl")),{title:"Powtórka"})}
else if(a=="lrev"){begin("rev",adaptiveQs(L[i].w),{title:"Powtórka: "+L[i].t})}
else if(a=="mixrev"){const idxs=[...document.querySelectorAll(".mixchk:checked")].map(c=>+c.value);if(!idxs.length)return;const words=idxs.flatMap(ix=>L[ix].w);begin("rev",adaptiveQs(words),{title:"Powtórka: lekcje "+idxs.map(ix=>ix+1).join(", ")})}
else if(a=="check")check();else if(a=="peek")check(true);else if(a=="next")next();
else if(a=="back"){Q=null;tab="learn";render()}
else if(a=="reset"){const row=$("#resetRow");if(row)row.innerHTML=`<span class="no">Na pewno usunąć postęp w języku: ${LANGS[LANG].name}?</span> <b data-act="reset2" style="cursor:pointer;color:var(--red);text-decoration:underline">Tak, usuń</b> · <span data-act="resetcancel" style="cursor:pointer;color:var(--mut);text-decoration:underline">Anuluj</span>`}
else if(a=="reset2"){S={done:{},test:{},w:{},stats:{minutes:0,days:{},testLog:[]}};save();render()}
else if(a=="resetcancel"){render()}
else if(a=="exportcode"){const ta=$("#synccode");if(ta){ta.value=exportCode();ta.focus();ta.select()}}
else if(a=="importcode"){const ta=$("#synccode"),msg=$("#syncmsg");if(!ta||!msg)return;ta.blur();
if(!ta.value.trim()){msg.innerHTML='<span class="no">Najpierw wklej kod w pole powyżej.</span>';return}
msg.innerHTML='To nadpisze obecny postęp na tym urządzeniu (oba języki). <b data-act="importcode2" style="cursor:pointer;color:var(--ac);text-decoration:underline">Potwierdź import</b> · <span data-act="importcancel" style="cursor:pointer;color:var(--mut);text-decoration:underline">Anuluj</span>'}
else if(a=="importcode2"){const ta=$("#synccode"),msg=$("#syncmsg");if(!ta||!msg)return;
if(importCode(ta.value)){msg.innerHTML='<span class="ok">Zaimportowano! Odświeżam…</span>';setTimeout(()=>location.reload(),500)}
else msg.innerHTML='<span class="no">Nieprawidłowy kod — sprawdź, czy skopiował się w całości.</span>'}
else if(a=="importcancel"){const msg=$("#syncmsg");if(msg)msg.innerHTML=""}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&Q){e.preventDefault();Q.fb?next():check()}});
document.addEventListener("change",e=>{if(e.target.id=="vs"){S.voice=e.target.value;save();say("Buongiorno, come stai?")}});
try{speechSynthesis.onvoiceschanged=()=>{if(!Q&&tab=="learn")render()}}catch(e){}
renderChrome();
render();
</script><script>document.addEventListener('DOMContentLoaded',function(){var b=document.createElement('div');b.setAttribute('role','note');b.style.cssText='background:#fff4d6;color:#4a3500;border-bottom:3px solid #f0b429;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;text-align:center;font:600 15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;position:relative;z-index:5;';b.innerHTML='<div style="font-size:17px;font-weight:800;letter-spacing:.04em">⚠️ WERSJA DEMO</div><div style="font-weight:500;margin-top:3px">To pokazowa wersja aplikacji do oglądania w przeglądarce. Możesz ją wypróbować, ale postępy w nauce zapisują się tylko w Twojej przeglądarce. <a href="../" style="color:inherit;text-decoration:underline;white-space:nowrap">Wróć do listy aplikacji</a></div>';document.body.insertBefore(b,document.body.firstChild)});</script>
</body></html>
